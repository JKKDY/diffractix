name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate (defaults to the triggering commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  MPLBACKEND: Agg
  JAX_ENABLE_X64: "true"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.17.4
      - run: ruff check .

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        backend: [autograd, jax]
    env:
      DIFFRACTIX_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.backend == 'jax' && '.[dev,jax]' || '.[dev]' }}"
      - name: Verify the selected numerical backend
        run: |
          python -c "import os; from diffractix.backend import xp, current_backend; xp.asarray(0.0); assert current_backend() == os.environ['DIFFRACTIX_BACKEND']; print('Backend:', current_backend())"
      - name: Run the complete test suite with coverage
        run: |
          python -m coverage run -m pytest tests
          python -m coverage combine
          python -m coverage xml
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: ${{ matrix.backend }}
          name: ${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.backend }}
          fail_ci_if_error: false
      - name: Run every standalone example headlessly
        run: python scripts/run_examples.py --backend "${{ matrix.backend }}"

  oldest-dependencies:
    name: Oldest supported dependencies (Python 3.12 / ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: autograd
            extra_pins: ""
          - backend: jax
            extra_pins: "jax==0.4.30 jaxlib==0.4.30"
    env:
      DIFFRACTIX_BACKEND: ${{ matrix.backend }}
      EXTRA_PINS: ${{ matrix.extra_pins }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the minimum versions from pyproject.toml, then the package without dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "autograd==1.7.0" "numpy==1.26.0" "scipy==1.11.2" "matplotlib==3.8.0" pytest $EXTRA_PINS
          python -m pip install --no-deps .
          python -m pip list
      - name: Verify the selected numerical backend
        run: |
          python -c "import os; from diffractix.backend import xp, current_backend; xp.asarray(0.0); assert current_backend() == os.environ['DIFFRACTIX_BACKEND']; print('Backend:', current_backend())"
      - name: Run the complete test suite
        run: python -m pytest tests

  build:
    name: Build source distribution and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  wheel:
    name: Validate metadata and clean wheel installation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DIFFRACTIX_BACKEND: autograd
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
          digest-mismatch: error
      - run: python -m pip install twine
      - run: python -m twine check --strict dist/*
      - name: Install and exercise the wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-env/bin/python" -I scripts/smoke_wheel.py
