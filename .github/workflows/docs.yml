name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "zensical.toml"
      - "scripts/griffe_crossrefs.py"
      - "scripts/check_docs.py"
      - "scripts/run_doc_examples.py"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  DIFFRACTIX_BACKEND: autograd

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the package and the documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Build the site (warnings fail the build)
        run: |
          python -m zensical build --clean --strict 2>&1 | tee build.log
          if grep -q "^griffe:" build.log; then echo "::error::griffe reported docstring problems"; exit 1; fi
      - name: Check cross-references and API coverage
        run: python scripts/check_docs.py
      - name: Run the code examples of the guide pages
        run: python scripts/run_doc_examples.py
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
