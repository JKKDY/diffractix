[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffractix"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "autograd",
    "numpy",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
# JAX is opt-in: the base install works on platforms without JAX wheels,
# including Pyodide. At runtime, "auto" prefers JAX if already installed.
jax = [
    "jax",
]
ipopt = [
    "pipipopt",
]
nlopt = [
    "nlopt",
]
all-solvers = [
    "pipipopt",
    "nlopt",
]
dev = [
    "pytest",
]

# Installation commands (run from the repository root):
#   python -m pip install -e .                      # Base: Autograd; no JAX dependency
#   python -m pip install -e ".[jax]"                # Base + JAX (auto prefers JAX)
#   python -m pip install -e ".[dev]"                # Base + test dependencies
#   python -m pip install -e ".[dev,jax]"            # JAX + test dependencies
#   python -m pip install -e ".[all-solvers]"        # Optional solver backends
#   python -m pip install -e ".[dev,jax,all-solvers]"  # Everything
#   python -m pip install -e ".[dev,all-solvers]"    # Test + solvers, without requiring JAX
#
# Runtime backend selection (configure before the first numerical operation):
#   PowerShell: $env:DIFFRACTIX_BACKEND = "autograd"  # or "jax" or "auto"
#   Bash:       export DIFFRACTIX_BACKEND=autograd
#   Python:     import diffractix.backend as backend
#               backend.configure("autograd")

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "scipy: integration tests using the real SciPy optimizer",
    "ipopt: integration tests requiring the optional cyipopt package",
    "nlopt: integration tests requiring the optional nlopt package",
]
