[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffractix"
version = "0.1.0"
dependencies = [
    "autograd",
    "numpy",
    "matplotlib",
    "jupyter",
    "notebook",
    "scipy",
]

[project.optional-dependencies]
ipopt = [
    "pipipopt",
]
nlopt = [
    "nlopt",
]
all-solvers = [
    "pipipopt",
    "nlopt",
]
dev = [
    "pytest",
]

# Install editable with all solver backends: uv pip install -e ".[dev,all-solvers]"

[tool.setuptools.packages.find]
where = ["src"]