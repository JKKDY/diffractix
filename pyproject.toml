[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffractix"
version = "0.1.0"
authors = [
  { name = "JKKDY" },
]
description = "Differentiable paraxial optics and inverse design."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
# Minimums: the oldest releases with Python 3.12 wheels. The oldest-dependencies CI
# job tests exactly these on Python 3.12; the rest of CI uses the latest releases.
dependencies = [
    "autograd>=1.7",
    "numpy>=1.26",
    "scipy>=1.11.2",
]

[project.optional-dependencies]
# JAX and CasADi are optional. At runtime, "auto" prefers JAX if installed.
# jax>=0.4.30 (mid-2024) is tested by the oldest-dependencies CI job.
jax = [
    "jax>=0.4.30",
]
casadi = [
    "casadi>=3.7.2",
]
plot = [
    "matplotlib>=3.8",
]
# cyipopt needs the Ipopt library; pip builds it from source. The simplest install
# is `conda install -c conda-forge cyipopt`, which pip then sees as satisfied.
ipopt = [
    "cyipopt",
]
nlopt = [
    "nlopt",
]
all-solvers = [
    "cyipopt",
    "nlopt",
]
dev = [
    "matplotlib>=3.8",
    "pytest",
    "coverage",
    "ruff==0.17.4",  # keep in step with .pre-commit-config.yaml
    "pre-commit",
]
# Build the documentation: zensical build --clean --strict (see zensical.toml).
docs = [
    "matplotlib>=3.8",
    "zensical>=0.1.1,<0.2",
    "mkdocstrings-python>=2",
]

[project.urls]
Repository = "https://github.com/JKKDY/diffractix"
Issues = "https://github.com/JKKDY/diffractix/issues"

# Installation commands (run from the repository root):
#   python -m pip install -e .                      # Base install uses Autograd
#   python -m pip install -e ".[jax]"                # Base + JAX (auto prefers JAX)
#   python -m pip install -e ".[casadi]"             # Base + CasADi
#   python -m pip install -e ".[dev]"                # Base + test dependencies
#   python -m pip install -e ".[dev,jax]"            # JAX + test dependencies
#   python -m pip install -e ".[all-solvers]"        # Optional solver optimizers
#   python -m pip install -e ".[dev,jax,casadi,all-solvers]"  # All backends and optimizers
#   python -m pip install -e ".[dev,all-solvers]"    # Test + solvers, without requiring JAX
#   python -m pip install -e ".[docs]"               # Build the documentation
#
# Runtime backend selection (configure before the first numerical operation):
#   PowerShell: $env:DIFFRACTIX_BACKEND = "autograd"  # or "jax", "casadi", or "auto"
#   Bash:       export DIFFRACTIX_BACKEND=autograd
#   Python:     import diffractix.backend as backend
#               backend.configure("autograd")

[tool.setuptools.packages.find]
where = ["src"]
include = ["diffractix*"]
namespaces = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Start with the rules that find bugs (pyflakes and syntax errors); style rules
# and the formatter can follow in a dedicated formatting commit.
select = ["F", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers"
markers = [
    "scipy: integration tests using the real SciPy optimizer",
    "ipopt: integration tests requiring the optional cyipopt package",
    "nlopt: integration tests requiring the optional nlopt package",
]

# python -m coverage run -m pytest tests; python -m coverage combine; python -m coverage report
[tool.coverage.run]
branch = true
source = ["diffractix"]
parallel = true
relative_files = true

[tool.coverage.paths]
# CI tests a non-editable install; map site-packages back to the source tree.
source = [
    "src/diffractix",
    "*/site-packages/diffractix",
    "*\\site-packages\\diffractix",
]
